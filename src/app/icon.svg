<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C3E50"/>
      <stop offset="1" stop-color="#1B2838"/>
    </linearGradient>
  </defs>

  <!-- Midnight rounded background -->
  <rect width="512" height="512" rx="96" fill="url(#g)"/>

  <!-- Gold ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#C2A873" stroke-width="18"/>

  <!-- Monogram: I higher, F lower -->
  <g fill="#F6F5F3" font-family="Montserrat, Arial, sans-serif" font-weight="700">
    <text x="200" y="300" font-size="240" text-anchor="middle" letter-spacing="4">I</text>
    <text x="320" y="360" font-size="240" text-anchor="middle" letter-spacing="4">F</text>
  </g>
</svg>
